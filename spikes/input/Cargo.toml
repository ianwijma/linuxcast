[package]
name = "linuxcast-input-spike"
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "linuxcast-input-spike-supervisor"
