[[bin]]
name = "linuxcast-input-spike-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "linuxcast-input-spike-synthetic-lab"
path = "src/bin/synthetic-lab.rs"

[[bin]]
name = "linuxcast-input-spike-context-probe"
path = "src/bin/context-probe.rs"

[[bin]]
name = "linuxcast-input-spike-peer-probe"
path = "src/bin/peer-probe.rs"

[[test]]
name = "peer-observer-private"
path = "tests/peer-observer-private.rs"
harness = false
