erif" x="72" y="628" class="muted">Terminal</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="410" y="628" class="">Open</text><rect x="464" y="610" width="56" height="25" rx="4" fill="#35363f" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="472" y="628" class="mono">Enter</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="540" y="628" class="">Actions</text><rect x="620" y="610" width="64" height="25" rx="4" fill="#35363f" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="628" y="628" class="mono">Ctrl K</text><rect x="800" y="232" width="280" height="306" rx="12" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="820" y="266" class="muted">Search actions…</text><path d="M800 284H1080" stroke="#454751"/><rect x="808" y="296" width="264" height="36" rx="8" fill="#35363f" stroke="#35363f"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="824" y="320" class="">Open application</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="824" y="362" class="">Open new window</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="824" y="404" class="">Assign hotkey</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="824" y="446" class="">Add alias</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="824" y="488" class="">Remove favourite</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="800" y="578" class="muted">ACTIONS</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="800" y="605" class="">Stable primary action; searchable</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="800" y="631" class="">secondary actions and shortcuts.</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="718" class="h2">Design rules</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="752" class="">01  Fine border + opaque fallback</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="784" class="">02  Neutral selection, explicit focus</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="640" y="752" class="">03  Icons, subtitles and accessories align</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="640" y="784" class="">04  Shared footer across all command views</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="852" class="muted">Proposed example · not an application screenshot</text>
