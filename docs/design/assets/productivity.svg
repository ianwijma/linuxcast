<text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="58" class="h1">Linuxcast / everyday productivity</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="88" class="muted">Notes and agenda share search, typography, actions and local-data status</text><rect x="48" y="128" width="760" height="660" rx="16" fill="#1c1d22" stroke="#454751"/><rect x="48" y="128" width="220" height="660" rx="16" fill="#18191e" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="170" class="h2">Notes</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="206" class="muted">Search notes…</text><rect x="60" y="230" width="196" height="48" rx="8" fill="#35363f" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="260" class="">Project journal</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="308" class="muted">Meeting checklist</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="352" class="muted">Quick note</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="176" class="h1">Project journal</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="214" class="muted">Saved locally · today</text><path d="M288 236H786" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="284" class="h2">Next steps</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="326" class="">Define a useful first workflow.</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="362" class="">Keep the keyboard path consistent.</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="416" class="">☐ Review the task dependencies</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="454" class="">☐ Test the supported desktop sessions</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="520" class="muted">Type / for blocks and actions</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="296" y="750" class="">Markdown export</text><rect x="646" y="732" width="64" height="25" rx="4" fill="#35363f" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="654" y="750" class="mono">Ctrl K</text><rect x="840" y="128" width="392" height="660" rx="16" fill="#1c1d22" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="864" y="170" class="h2">Agenda</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="864" y="208" class="muted">Thursday, 22 October</text><path d="M840 236H1232" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="864" y="278" class="muted">UP NEXT</text><rect x="856" y="300" width="360" height="144" rx="12" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="876" y="336" class="h2">Project review</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="876" y="372" class="muted">14:00–14:30 · Local calendar</text><rect x="876" y="396" width="104" height="32" rx="8" fill="#35363f" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="894" y="419" class="">Details</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="864" y="496" class="h2">Team calendar</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="864" y="532" class="muted">Read-only subscription</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="864" y="572" class="">Event editing is unavailable for</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="864" y="600" class="">this source.</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="864" y="750" class="muted">Refresh agenda</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="850" class="muted">Content remains local. Calendar source capabilities determine which actions are offered.</text>
