<title id="title">Linuxcast notes and calendar design</title><desc id="desc">Original Linuxcast planning mockup. Proposed layout, not a screenshot of working software.</desc>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#f5f5f7;font-size:16px}.muted{fill:#adb0bb;font-size:13px}.h1{font-size:32px;font-weight:600}.h2{font-size:20px;font-weight:600}.mono{font-family:DejaVu Sans Mono,monospace;font-size:12px}.coral{fill:#ff786e}</style>
