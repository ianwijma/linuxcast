<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">Linuxcast light settings and keyboard consent</title><desc id="desc">Original Linuxcast planning mockup. Proposed layout, not a screenshot of working software.</desc>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#1c1d24;font-size:16px}.muted{fill:#535866;font-size:13px}.h1{font-size:32px;font-weight:600}.h2{font-size:20px;font-weight:600}.mono{font-family:DejaVu Sans Mono,monospace;font-size:12px}.coral{fill:#ff786e}</style>
<rect width="100%" height="100%" fill="#f2f3f6"/>
<text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="58" class="h1">Linuxcast / settings and consent</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="88" class="muted">Light theme · permissions remain legible and specific</text><rect x="48" y="128" width="1184" height="660" rx="16" fill="#ffffff" stroke="#454751"/><rect x="48" y="128" width="240" height="660" rx="16" fill="#f7f7f9" stroke="#454751"/><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="172" class="h2">Settings</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="224" class="">General</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="272" class="">Commands</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="320" class="">AI provider</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="368" class="">Integrations</text><rect x="60" y="390" width="216" height="40" rx="8" fill="#e8eaf0" stroke="#e8eaf0"/><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="416" class="">Keyboard input</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="464" class="">Privacy and data</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="324" y="174" class="h2">Keyboard input</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="324" y="214" class="muted">Optional system integration for Hyper and typed snippets.</text><rect x="324" y="242" width="864" height="132" rx="12" fill="#f7f7f9" stroke="#b9bdc8"/><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="348" y="276" class="">Disabled</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="348" y="308" class="">This component can observe physical keyboard input and emit keystrokes.</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="348" y="340" class="muted">Enable only the keyboards and features you want to use.</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="324" y="418" class="h2">Selected keyboards</text><rect x="324" y="440" width="864" height="52" rx="8" fill="#f7f7f9" stroke="#b9bdc8"/><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="344" y="472" class="">□  Built-in keyboard</text><rect x="324" y="504" width="864" height="52" rx="8" fill="#f7f7f9" stroke="#b9bdc8"/><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="344" y="536" class="">□  USB keyboard</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="324" y="600" class="">Features:  □ Hyper remapping    □ Typed snippet expansion</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="324" y="642" class="muted">Emergency disarm: Left Ctrl + Right Ctrl + Escape</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="324" y="678" class="muted">Unknown input fields may require manual insertion.</text><rect x="1002" y="716" width="186" height="42" rx="8" fill="#b92f32" stroke="#b92f32"/><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="1020" y="743" style="fill:#ffffff">Enable selected…</text><text fill="#1c1d24" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="850" class="muted">Installation never starts keyboard capture. Administrative consent follows this explanation.</text>
</svg>
