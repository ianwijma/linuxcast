<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
<title id="title">Linuxcast component and state examples</title><desc id="desc">Original Linuxcast planning mockup. Proposed layout, not a screenshot of working software.</desc>
<style>text{font-family:Inter,DejaVu Sans,Arial,sans-serif;fill:#f5f5f7;font-size:16px}.muted{fill:#adb0bb;font-size:13px}.h1{font-size:32px;font-weight:600}.h2{font-size:20px;font-weight:600}.mono{font-family:DejaVu Sans Mono,monospace;font-size:12px}.coral{fill:#ff786e}</style>
<rect width="100%" height="100%" fill="#111216"/>
<text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="58" class="h1">Linuxcast / component vocabulary</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="88" class="muted">List/detail, grids, forms and persistent state communication share one visual grammar</text><rect x="48" y="128" width="560" height="310" rx="16" fill="#1c1d22" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="166" class="h2">Clipboard History</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="198" class="muted">Search saved clips…</text><path d="M48 216H608" stroke="#454751"/><rect x="60" y="230" width="240" height="50" rx="8" fill="#35363f" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="260" class="">Meeting notes</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="310" class="muted">Image · 1280 × 720</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="76" y="358" class="muted">Copied file paths</text><path d="M320 216L320 420" stroke="#454751" fill="none"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="340" y="252" class="h2">Preview</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="340" y="292" class="">A useful excerpt remains</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="340" y="320" class="">readable before pasting.</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="340" y="374" class="muted">Text · today</text><rect x="640" y="128" width="592" height="310" rx="16" fill="#1c1d22" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="664" y="166" class="h2">Emoji and symbols</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="664" y="198" class="muted">FREQUENT</text><rect x="664" y="220" width="116" height="72" rx="8" fill="#35363f" stroke="#a6b9ff"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="709" y="264" class="h2">★</text><rect x="800" y="220" width="116" height="72" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="845" y="264" class="h2">✓</text><rect x="936" y="220" width="116" height="72" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="981" y="264" class="h2">→</text><rect x="1072" y="220" width="116" height="72" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="1117" y="264" class="h2">+</text><rect x="664" y="308" width="116" height="72" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="709" y="352" class="h2">♫</text><rect x="800" y="308" width="116" height="72" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="845" y="352" class="h2">#</text><rect x="936" y="308" width="116" height="72" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="981" y="352" class="h2">∞</text><rect x="1072" y="308" width="116" height="72" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="1117" y="352" class="h2">@</text><rect x="48" y="472" width="560" height="324" rx="16" fill="#1c1d22" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="512" class="h2">Create quicklink</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="548" class="muted">Name</text><rect x="72" y="560" width="512" height="40" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="88" y="586" class="">Search documentation</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="634" class="muted">URL template</text><rect x="72" y="646" width="512" height="40" rx="8" fill="#25262d" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="88" y="672" class="mono">https://example.org/?q={{vars.query}}</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="72" y="720" class="muted">Argument values are URL encoded.</text><rect x="468" y="744" width="116" height="34" rx="8" fill="#ff786e" stroke="#ff786e"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="500" y="767" style="fill:#151519">Save</text><rect x="640" y="472" width="592" height="324" rx="16" fill="#1c1d22" stroke="#454751"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="664" y="512" class="h2">State examples</text><circle cx="674" cy="552" r="5" fill="#f4c779"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="690" y="557" class="">Permission required</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="690" y="582" class="muted">Enable the desktop component to continue.</text><circle cx="674" cy="628" r="5" fill="#adb0bb"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="690" y="633" class="">No matching results</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="690" y="658" class="muted">Try a different query or open search settings.</text><circle cx="674" cy="704" r="5" fill="#ff8f91"/><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="690" y="709" class="">Response interrupted</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="690" y="734" class="muted">Partial text was kept. Retry is an explicit action.</text><text fill="#f5f5f7" font-size="16" font-family="DejaVu Sans,Arial,sans-serif" x="48" y="856" class="muted">Never disguise unsupported capabilities, failed paste or interrupted output as success.</text>
</svg>
