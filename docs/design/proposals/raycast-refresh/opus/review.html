        <fieldset><legend>Choose access</legend>${opt('once','Allow once','For this run only.')}${opt('version','Allow for version 1.2.0','A new version or a wider scope asks again.')}${opt('deny','Deny','The extension continues without the folder.')}</fieldset>
        <div class="card-f">${btn({label:'Cancel',ghost:1,msg:'would close the request without a decision (treated as deny for this run)'})}${btn({label:choice==='deny'?'Deny access':'Confirm',primary:1,msg:choice==='deny'?'would record a denial for version 1.2.0':choice==='once'?'would grant a one-time read of ~/Documents/Linuxcast/':'would grant read access for version 1.2.0'})}</div></div>`;
    page=`<div class="card"><div class="card-h"><div><h2>Session capabilities</h2><p>GNOME 48 · Wayland (synthetic probe result)</p></div><span style="flex:1"></span>${loading?statusTag('loading','Checking…'):btn({label:'Re-check',ghost:1,icon:'retry',msg:'would re-probe session capabilities'})}</div>
      ${capBand}<ul class="caps" aria-label="Capabilities" ${loading?'aria-busy="true"':''}>${caps}</ul></div>`;
    const capsFirst=['loading','error','unsupported','interrupted'].includes(st);
    const intro=`<h1>Permissions and capabilities</h1><p class="lead">Decisions waiting for you come first, then what this session supports. Capabilities are probed one by one, not inferred from the desktop name.</p>`;
    page=intro+(capsFirst?page+perm:perm+page);
  }
  return `<div class="spec" style="--frame-w:1180px"><span>Workspace · settings · searchable categories · cards radius 12</span><span>Deep link: linuxcast://settings/${esc(P.cat)}</span></div>
  <div class="ws"><div class="wsh">${tile('system','gear')}<span class="ttl">Settings</span><span class="grow"></span><span class="idchip hide-n">Debian 13 · GNOME 48 · Wayland (synthetic)</span></div>
    <div class="wsb set">${side}<section class="main page" aria-label="Settings page">${page}</section></div></div>`;
}

/* ================================================================ NOTES */
const NOTE={
 launcher:{look:['<b>Hanging alignment.</b> Group captions start on the title column; glyph tiles hang in a 32px track so titles form one clean edge.','<b>Nouns get tiles, verbs get lines.</b> Results (objects) use 20px colour glyph tiles; actions in the panel use monochrome line icons.','<b>Selection</b> is a neutral surface plus a 2px coral rail. Keyboard focus is a separate blue ring/underline.','<b>Footer as status line:</b> selected object on the left, primary verb + Enter, then Actions + Ctrl K on the right.','The action-panel filter sits at the bottom, next to the Ctrl K hint that opened it.'],
   keys:['Up/Down move · Enter primary · Ctrl+Enter secondary','Ctrl+K toggles actions · Esc closes actions → clears query → (would) dismiss','Tab reaches “Ask AI”; nothing is sent until you press Enter in chat','Enter on Search files / note / workflow / AI rows opens that review view (local only)']},
 files:{look:['List/detail divider is a focusable separator: Left/Right resize between 30% and 60%.','Metadata uses hairline rows with right-aligned tabular values; the path is monospace.','Preview errors keep the last-known metadata visible instead of blanking the pane.'],keys:['Up/Down move · Enter open · Ctrl+K actions','Esc closes actions, then returns to root search','Separator: focus, then Left/Right']},
 emoji:{look:['Grid cells keep a stable 72px footprint even while loading.','Selected cell: neutral surface + a short horizontal rail (the grid version of the row rail).','When paste is declined or unsupported, the primary action becomes <b>Copy</b> — never a fake “Paste”.'],keys:['In the search field: Up/Down move by row; Left/Right keep native caret movement','Tab into the grid: all four arrows move','Enter primary · Ctrl+Enter Copy · Ctrl+K actions · Esc back']},
 chat:{look:['Assistant prose is unboxed on the measure; user turns use a subdued surface.','Tool activity is a collapsible block with status words + shape glyphs; arguments are inspectable.','Identity is a read-only chip: “Configured provider / configured model”. No per-chat selector.','The composer states exactly what will be sent (“your message + 1 file”).'],keys:['Enter sends (simulated) · Shift+Enter new line','Ctrl+N new chat (simulated)','Loading state shows a pending approval that blocks the response']},
 notes:{look:['Quiet header: save status is text + glyph, not a perpetual animation. Failure becomes a persistent band.','Native checkboxes for tasks; the slash menu reuses the action-panel row.','Dictation unavailability says why, and that audio never silently goes remote.'],keys:['Type / in the last line for blocks · Up/Down · Enter (simulated) · Esc closes','Space toggles a task (local only)']},
 workflow:{look:['Nodes reuse the row vocabulary: tile + uppercase category + title + one-line config.','Ports carry type labels on edges; invalid edges are dashed <i>and</i> labelled, never colour-only.','“Structured list” is a complete non-drag path: select, connect, reorder, remove.','AI steps show the global model read-only.'],keys:['Tab between nodes · Enter/Space selects','Canvas ↔ Structured list toggle in the toolbar','Ctrl+Shift+A add node (simulated)']},
 settings:{look:['Capability rows: name · status (shape glyph + words) · backend in mono · one remediation.','Permission card shows package, operation, exact scope and the extension’s own reason, labelled as untrusted text.','Privileged input is always shown <b>Disabled · stopped</b>.','AI credential and model are separate controls.'],keys:['Tab through categories and controls · arrows within the radio group','Category buttons expose the current page via aria-current']},
};
function renderNotes(){
  const n=NOTE[S.view];
  document.getElementById('notes').innerHTML=`<section><h2>Look for</h2><ul>${n.look.map(x=>`<li>${x}</li>`).join('')}</ul></section>
   <section><h2>Keyboard (prototype)</h2><ul>${n.keys.map(x=>`<li>${x}</li>`).join('')}</ul></section>
   <section><h2>Honesty notes</h2><p>All content is synthetic. Buttons change local selection/view or show a “Simulated” notice; nothing touches your system, clipboard or network.</p><p>This mock is not accessibility evidence for the product. Electron, Orca, GNOME/KDE Wayland/X11 checks remain separate gates.</p></section>`;
}

/* ================================================================ RENDER */
const RENDER={launcher:vLauncher,files:vFiles,emoji:vEmoji,chat:vChat,notes:vNotes,workflow:vWorkflow,settings:vSettings};
const stage=document.getElementById('stage');
function render(){
  const a=document.activeElement;const aid=a&&a.id&&stage.contains(a)?a.id:null;
  const selS=a&&aid&&'selectionStart' in a?[a.selectionStart,a.selectionEnd]:null;
  plateN=0;
  stage.innerHTML=RENDER[S.view]();
  document.querySelectorAll('.rv-tab').forEach(t=>{const on=t.dataset.view===S.view;t.setAttribute('aria-selected',on);t.tabIndex=on?0:-1});
  stage.setAttribute('aria-labelledby','tab-'+S.view);
  document.getElementById('stateSel').value=S.state;
  if(aid){const el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(selS&&'setSelectionRange' in el){try{el.setSelectionRange(selS[0],selS[1])}catch(e){}}}}
  stage.querySelectorAll('.results [aria-selected=true], .ap-l [aria-selected=true]').forEach(revealIn);
  if(S.view==='chat'){const m=stage.querySelector('.msgs');if(m)m.scrollTop=m.scrollHeight}
  if(S.state!=='default'&&S.view==='launcher'){const b=stage.querySelector('#lres .plate.band');b&&revealIn(b)}
  renderNotes();
  history.replaceState(null,'',`#view=${S.view}&state=${S.state}&theme=${S.theme}${S.motion==='reduced'?'&motion=reduced':''}${S.view==='workflow'&&S.w.mode==='list'?'&mode=list':''}`);
}
/* scroll only the nearest scrolling container, never the review page */
function revealIn(el){
  const c=el.closest('.results,.ap-l');if(!c)return;
  const er=el.getBoundingClientRect(),cr=c.getBoundingClientRect();
  if(er.bottom>cr.bottom)c.scrollTop+=er.bottom-cr.bottom+8;
  else if(er.top<cr.top)c.scrollTop-=cr.top-er.top+8;
}
function setState(s){
  S.state=s;
  S.l.q=s==='empty'?'lanch chekclist':s==='loading'?'launch':'';
  S.l.panel=s==='default';S.l.apSel=0;S.l.apQ='';
  S.l.sel=s==='denied'?'ext-rnh':s==='unsupported'?'sys-win':s==='interrupted'?'ai-sum':s==='loading'?'note-checklist':s==='error'?'cmd-files':'file-checklist';
  S.f.q=s==='empty'?'checklst':'';S.f.sel=s==='unsupported'?'f2':'f1';S.f.panel=false;
  S.e.q=s==='empty'?'penguinn':'';S.e.panel=false;
  S.n.slash=s==='default'?'/':'';
  S.w.tab=s==='interrupted'?'debug':'configure';S.w.sel=s==='unsupported'?'n1':s==='error'?'n4':'n3';
  S.s.cat=s==='interrupted'?'permissions':S.s.cat==='ai'||S.s.cat==='input'?S.s.cat:'permissions';S.s.q='';
  render();
}
function setView(v){S.view=v;render()}

/* --------------------------------------------------- per-view selection */
function shellCtx(){return S.view==='launcher'?S.l:S.view==='files'?S.f:S.view==='emoji'?S.e:null}
function listIds(){
  if(S.view==='launcher') return launcherItems().map(i=>i.id);
  if(S.view==='files'){let l=FILES.filter(f=>!S.f.q||f.t.toLowerCase().includes(S.f.q.toLowerCase()));if(S.state==='interrupted')l=l.slice(0,4);return l.map(f=>f.id)}
  return [];
}
function moveSel(d){
  const ids=listIds();if(!ids.length)return;
  const ctx=shellCtx();let i=ids.indexOf(ctx.sel);i=Math.max(0,Math.min(ids.length-1,(i<0?0:i+d)));ctx.sel=ids[i];render();
}
function currentKind(){
  if(S.view==='launcher'){const it=launcherItems().find(i=>i.id===S.l.sel);return it}
  return null;
}
function invokePrimary(secondary){
  if(S.view==='launcher'){
    const it=currentKind();if(!it){if(S.l.q){setView('files')}return}
    if(secondary){toast(`would run “${(ACTIONS[it.kind]||ACTIONS.command)[0][1]?.l||'secondary action'}” for ${it.t}`);return}
    if(S.state==='unsupported'&&it.id==='sys-win'){toast('“Switch windows” is unavailable in this session; nothing runs');return}
    if(it.go){toast(`${(ACTIONS[it.kind]||ACTIONS.command)[0][0].l} — showing the ${it.go} review view (local view change only)`);setView(it.go);return}
    toast(`would ${(ACTIONS[it.kind]||ACTIONS.command)[0][0].l.toLowerCase()} “${it.t}”`);return;
  }
  if(S.view==='files'){const f=FILES.find(x=>x.id===S.f.sel);if(f)toast(secondary?`would show ${f.t} in Files`:`would open ${f.t} in its default application`);return}
  if(S.view==='emoji'){const copyOnly=['denied','unsupported','interrupted'].includes(S.state);toast(copyOnly||secondary?'would copy the emoji to the clipboard (Copy, not Paste)':'would paste the emoji into Text Editor via a consented portal');return}
}
function togglePanel(open){
  const ctx=shellCtx();if(!ctx)return;
  ctx.panel=open===undefined?!ctx.panel:open;ctx.apSel=0;ctx.apQ='';ctx._anim=ctx.panel;render();
  if(ctx.panel){const f=document.getElementById('apq');f&&f.focus()}else{const q=document.getElementById(S.view==='launcher'?'lq':S.view==='files'?'fq':'eq');q&&q.focus()}
}
function apInvoke(idx){
  const ctx=shellCtx();const a=ctx._flat&&ctx._flat[idx];if(!a)return;
  toast(a.d?`would ask for confirmation, then “${a.l}”`:`would run “${a.l}”`);
  ctx.panel=false;render();const q=document.getElementById(S.view==='launcher'?'lq':S.view==='files'?'fq':'eq');q&&q.focus();
}

/* --------------------------------------------------------------- events */
stage.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,arg=b.dataset.arg;
  if(b.getAttribute('aria-disabled')==='true'&&act!=='sim'){return}
  switch(act){
    case 'sim': toast(b.dataset.msg||'action'); break;
    case 'view': if(b.dataset.v==='settings'){S.s.cat='permissions'} setView(b.dataset.v); break;
    case 'settingsai': S.s.cat='ai'; setView('settings'); break;
    case 'state': setState(arg); break;
    case 'lsel': S.l.sel=arg; render(); break;
    case 'fsel': S.f.sel=arg; render(); break;
    case 'esel': S.e.sel=arg; render(); {const el=stage.querySelector('.ecell[aria-selected=true]');el&&el.focus()} break;
    case 'csel': S.c.sel=arg; render(); break;
    case 'nsel': S.n.sel=arg; render(); break;
    case 'wsel': S.w.sel=arg; render(); break;
    case 'wtab': S.w.tab=arg; render(); break;
    case 'wfmode': S.w.mode=arg; render(); break;
    case 'scat': S.s.cat=arg; render(); break;
    case 'sclear': S.s.q=''; if(S.state==='empty'){S.state='default'} render(); break;
    case 'lclear': S.l.q=''; render(); document.getElementById('lq').focus(); break;
    case 'fclear': S.f.q=''; if(S.state==='empty')S.state='default'; render(); break;
    case 'eq': S.e.q=arg; if(S.state==='empty')S.state='default'; render(); break;
    case 'primary': invokePrimary(false); break;
    case 'aptoggle': togglePanel(); break;
    case 'apitem': apInvoke(+arg); break;
    case 'slashpick': toast(`would insert a “${arg}” block (mock content unchanged)`); S.n.slash=''; render(); break;
    case 'ntask': S.n.tasks[arg]=b.checked; break;
    case 'pchoice': S.s.choice=arg; render(); break;
  }
});
stage.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='lq'){S.l.q=t.value;S.l.apSel=0;render()}
  else if(t.id==='fq'){S.f.q=t.value;render()}
  else if(t.id==='eq'){S.e.q=t.value;render()}
  else if(t.id==='apq'){const c=shellCtx();c.apQ=t.value;c.apSel=0;render()}
  else if(t.id==='slash'){const was=S.n.slash.startsWith('/');S.n.slash=t.value;S.n.slashSel=0;S.n._anim=!was&&t.value.startsWith('/');render();S.n._anim=false}
  else if(t.id==='nq'){S.n.q=t.value;render()}
  else if(t.id==='sq'){S.s.q=t.value;render()}
});
stage.addEventListener('change',e=>{if(e.target.id==='ecat'){S.e.cat=e.target.value;render()}});
stage.addEventListener('keydown',e=>{
  const t=e.target;const ctrl=e.ctrlKey||e.metaKey;
  const shellInput=['lq','fq','eq'].includes(t.id);
  if(ctrl&&(e.key==='k'||e.key==='K')&&shellCtx()){e.preventDefault();togglePanel();return}
  if(t.id==='apq'){
    const c=shellCtx();const n=(c._flat||[]).length;
    if(e.key==='ArrowDown'){e.preventDefault();c.apSel=Math.min(n-1,c.apSel+1);render()}
    else if(e.key==='ArrowUp'){e.preventDefault();c.apSel=Math.max(0,c.apSel-1);render()}
    else if(e.key==='Enter'){e.preventDefault();apInvoke(c.apSel)}
    else if(e.key==='Escape'){e.preventDefault();togglePanel(false)}
    return;
  }
  if(shellInput){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(t.id==='eq'){gridMove(e.key==='ArrowDown'?'down':'up');return}
      moveSel(e.key==='ArrowDown'?1:-1);return}
    if(e.key==='Enter'){e.preventDefault();invokePrimary(ctrl);return}
    if(e.key==='Escape'){e.preventDefault();
      const c=shellCtx();
      if(c.panel){togglePanel(false);return}
      if(S.view!=='launcher'){toast('Escape pops the nested view (local)');setView('launcher');document.getElementById('lq').focus();return}
      if(S.l.q){S.l.q='';render();return}
      toast('Escape would dismiss the launcher; the prototype stays open');return}
  }
  if(t.classList&&t.classList.contains('ecell')){
    const m={ArrowRight:'right',ArrowLeft:'left',ArrowDown:'down',ArrowUp:'up'}[e.key];
    if(m){e.preventDefault();gridMove(m,true);return}
    if(e.key==='Enter'){e.preventDefault();invokePrimary(ctrl);return}
    if(e.key==='Escape'){e.preventDefault();if(S.e.panel){togglePanel(false)}else{setView('launcher');document.getElementById('lq').focus()}return}
  }
  if(t.id==='fsep'){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();S.f.ratio=Math.max(30,Math.min(60,S.f.ratio+(e.key==='ArrowRight'?2:-2)));render()}
    if(e.key==='Home'){e.preventDefault();S.f.ratio=30;render()} if(e.key==='End'){e.preventDefault();S.f.ratio=60;render()}
  }
  if(t.id==='slash'){
    const items=stage.querySelectorAll('#slm [role=option]');
    if(items.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();S.n.slashSel=(S.n.slashSel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;render()}
    else if(e.key==='Enter'&&items.length){e.preventDefault();toast(`would insert a “${items[S.n.slashSel].textContent.trim()}” block (mock content unchanged)`);S.n.slash='';render()}
    else if(e.key==='Escape'){e.preventDefault();S.n.slash='';render()}
  }
  if(t.id==='ctext'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(S.state!=='unsupported'&&S.state!=='loading')toast('would send your message and 1 file to the configured provider')}
});
/* geometry-based grid navigation (works across section captions) */
function gridMove(dir,focusCell){
  const cells=[...stage.querySelectorAll('.ecell[data-arg]')];if(!cells.length)return;
  let i=cells.findIndex(c=>c.getAttribute('aria-selected')==='true');if(i<0)i=0;
  const c=cells[i].getBoundingClientRect();let next=null;
  if(dir==='right')next=cells[i+1];else if(dir==='left')next=cells[i-1];
  else{
    const cand=cells.filter(x=>{const r=x.getBoundingClientRect();return dir==='down'?r.top>c.top+4:r.top<c.top-4});
    if(cand.length){const rowTop=dir==='down'?Math.min(...cand.map(x=>x.getBoundingClientRect().top)):Math.max(...cand.map(x=>x.getBoundingClientRect().top));
      const row=cand.filter(x=>Math.abs(x.getBoundingClientRect().top-rowTop)<4);
      next=row.reduce((b,x)=>Math.abs(x.getBoundingClientRect().left-c.left)<Math.abs(b.getBoundingClientRect().left-c.left)?x:b,row[0])}
  }
  if(!next)return;S.e.sel=next.dataset.arg;render();
  if(focusCell){const el=stage.querySelector('.ecell[aria-selected=true]');el&&el.focus()}
}
/* pointer resize for the list/detail separator */
stage.addEventListener('pointerdown',e=>{
  if(e.target.id!=='fsep')return;const ld=e.target.parentElement.getBoundingClientRect();e.target.setPointerCapture(e.pointerId);
  const mv=ev=>{S.f.ratio=Math.round(Math.max(30,Math.min(60,(ev.clientX-ld.left)/ld.width*100)));const el=stage.querySelector('.ld');el.style.setProperty('--ld-cols',`minmax(240px,${S.f.ratio}%) 9px minmax(280px,1fr)`);e.target.setAttribute('aria-valuenow',S.f.ratio)};
  const up=()=>{e.target.removeEventListener('pointermove',mv);e.target.removeEventListener('pointerup',up);render()};
  e.target.addEventListener('pointermove',mv);e.target.addEventListener('pointerup',up);
});

/* --------------------------------------------------------- review chrome */
const tabs=[...document.querySelectorAll('.rv-tab')];
tabs.forEach((t,ix)=>{
  t.addEventListener('click',()=>setView(t.dataset.view));
  t.addEventListener('keydown',e=>{let j=null;if(e.key==='ArrowRight')j=(ix+1)%tabs.length;if(e.key==='ArrowLeft')j=(ix-1+tabs.length)%tabs.length;if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;
    if(j!==null){e.preventDefault();setView(tabs[j].dataset.view);tabs[j].focus()}});
});
document.getElementById('stateSel').addEventListener('change',e=>setState(e.target.value));
function applyTheme(){document.documentElement.dataset.theme=S.theme;const b=document.getElementById('themeBtn');b.setAttribute('aria-pressed',S.theme==='light');document.getElementById('themeLbl').textContent=S.theme==='light'?'Dark theme':'Light theme'}
function applyMotion(){document.documentElement.dataset.motion=S.motion;document.getElementById('motionBtn').setAttribute('aria-pressed',S.motion==='reduced')}
document.getElementById('themeBtn').addEventListener('click',()=>{S.theme=S.theme==='dark'?'light':'dark';applyTheme();render()});
document.getElementById('motionBtn').addEventListener('click',()=>{S.motion=S.motion==='reduced'?'full':'reduced';applyMotion();render()});

/* ------------------------------------------------------------------ boot */
(function boot(){
  const h=new URLSearchParams(location.hash.slice(1));
  const mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
  S.theme=h.get('theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  S.motion=h.get('motion')==='reduced'||(mq&&mq.matches)?'reduced':'full';
  if(mq&&mq.addEventListener)mq.addEventListener('change',ev=>{S.motion=ev.matches?'reduced':'full';applyMotion();render()});
  const v=h.get('view');if(VIEWS.includes(v))S.view=v;
  if(h.get('mode')==='list')S.w.mode='list';
  applyTheme();applyMotion();
  const st=h.get('state');setState(['default','loading','empty','error','denied','unsupported','interrupted'].includes(st)?st:'default');
})();
</script>
