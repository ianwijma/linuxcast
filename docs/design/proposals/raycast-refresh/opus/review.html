<!doctype html>
<html lang="en" data-theme="dark" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Linuxcast · Instrument (Opus candidate) · design review</title>
<style>
/* =========================================================================
   Linuxcast "Instrument" — proposal review prototype (Opus candidate)
   Self-contained: no network, no remote fonts, no dependencies.
   Every value below maps to opus/tokens.json (baseline + proposal roles).
   ========================================================================= */
:root{
  --font-ui: Inter, "Inter Variable", Cantarell, "Noto Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Noto Sans Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  --font-emoji: "Noto Color Emoji", "Twemoji Mozilla", "Apple Color Emoji", sans-serif;
  --fs-caption:12px; --fs-body:14px; --fs-emph:16px; --fs-panel:20px; --fs-ws:28px;
  --lh-caption:16px; --lh-body:20px; --lh-emph:24px; --lh-panel:28px; --lh-ws:36px; --lh-prose:24px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
  --r-shell:16px; --r-pop:12px; --r-row:8px; --r-key:4px;
  --launcher-w:720px; --launcher-max-h:560px; --header-h:56px; --row-h:40px; --footer-h:36px; --action-w:280px;
  --glyph-track:32px; --glyph-tile:20px; --rail:2px; --rail-inset:4px; --gcap-h:28px; --key-col:96px;
  --action-row:36px; --action-filter:44px; --side-w:240px; --insp-w:300px; --measure:680px; --node-w:208px;
  --state-ms:100ms; --panel-ms:160ms; --ease:cubic-bezier(.2,0,0,1); --panel-offset:4px;
  --t-command:#4C5FD5; --t-files:#A9650F; --t-clipboard:#137F79; --t-quicklink:#7451C9;
  --t-ai:#B83E66; --t-workflow:#2B7D47; --t-notes:#8A6D00; --t-system:#5A5E6B; --glyph-on-tile:#FFFFFF;
}
html[data-theme=dark]{
  color-scheme: dark;
  --bg:#111216; --surface:#1C1D22; --raised:#25262D; --selection:#35363F; --border:#454751;
  --text:#F5F5F7; --muted:#ADB0BB; --accent:#FF786E; --accent-text:#151519; --focus:#A6B9FF;
  --danger:#FF8F91; --warning:#F4C779; --success:#8AD8AE;
  --divider:#2C2E35; --control-border:#7D808E; --rail-c:#FF786E; --user-msg:#2A2B33; --tool-surface:#202127;
  --canvas:#16171B; --canvas-dot:#2E3038; --scrim:#0A0B0EB3;
  --tint-danger:#2C2124; --tint-warning:#2A2620; --tint-success:#1E2A24; --tint-info:#20243A;
  --shadow-shell:0 0 0 1px #00000066, 0 24px 64px #0000008C, 0 4px 12px #00000066;
  --shadow-pop:0 16px 40px #00000080, 0 2px 6px #00000066;
  --hl:inset 0 1px 0 #FFFFFF0F;
}
html[data-theme=light]{
  color-scheme: light;
  --bg:#F2F3F6; --surface:#FFFFFF; --raised:#F7F7F9; --selection:#E8EAF0; --border:#B9BDC8;
  --text:#1C1D24; --muted:#535866; --accent:#B92F32; --accent-text:#FFFFFF; --focus:#3258BD;
  --danger:#B32235; --warning:#795000; --success:#17693E;
  --divider:#E2E4EA; --control-border:#7F8492; --rail-c:#B92F32; --user-msg:#EEEFF3; --tool-surface:#F7F7F9;
  --canvas:#ECEEF2; --canvas-dot:#CDD0D8; --scrim:#1C1D2466;
  --tint-danger:#FCEDEE; --tint-warning:#FBF3E2; --tint-success:#E9F5EE; --tint-info:#ECF0FB;
  --shadow-shell:0 0 0 1px #1C1D2414, 0 24px 56px #1C1D242E, 0 4px 12px #1C1D2414;
  --shadow-pop:0 16px 40px #1C1D2429, 0 2px 6px #1C1D241A;
  --hl:inset 0 1px 0 #FFFFFFCC;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-ui);font-size:var(--fs-body);line-height:var(--lh-body);color:var(--text);background:var(--bg);
  font-feature-settings:"cv11" 1,"ss01" 1;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.mono{font-family:var(--font-mono);font-feature-settings:normal}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ic,.tg{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic *,.tg *{vector-effect:non-scaling-stroke}
.ic{width:16px;height:16px}
.tg{width:14px;height:14px;color:var(--glyph-on-tile)}
.ic.fillc{fill:currentColor;stroke:none}

/* ---------- Review chrome (not product UI) ---------- */
.rv{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--divider)}
.rv-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.rv-id{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.rv-id svg{width:28px;height:28px;flex:none}
.rv-id b{font-size:var(--fs-body);font-weight:600;display:block;line-height:18px}
.rv-id span{font-size:var(--fs-caption);color:var(--muted);display:block;line-height:16px}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-key);border:1px solid var(--border);
  font-size:var(--fs-caption);color:var(--muted);white-space:nowrap}
.rv-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rv-tabs{max-width:1240px;margin:0 auto;padding:0 16px 10px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.rv-tab{height:32px;padding:0 12px;border-radius:var(--r-row);border:1px solid transparent;background:none;color:var(--muted);
  font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.rv-tab:hover{color:var(--text);background:color-mix(in srgb,var(--selection) 55%,transparent)}
.rv-tab[aria-selected=true]{color:var(--text);background:var(--selection);border-color:var(--border)}
.rv-tab .n{font-family:var(--font-mono);font-size:var(--fs-caption);color:var(--muted)}
.rv-field{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-caption);color:var(--muted)}
.sel{height:32px;border-radius:var(--r-row);border:1px solid var(--control-border);background:var(--surface);padding:0 8px;color:var(--text)}
.stage{padding:20px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:640px}
.spec{font:var(--fs-caption)/var(--lh-caption) var(--font-mono);color:var(--muted);width:min(var(--frame-w,720px),100%);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.notes{max-width:1240px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.notes section{border-top:1px solid var(--divider);padding-top:12px}
.notes h2{font-size:var(--fs-caption);line-height:var(--lh-caption);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
.notes ul{margin:0;padding-left:18px;color:var(--text)}
.notes li{margin:0 0 6px}
.notes p{margin:0 0 8px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;max-width:min(560px,calc(100% - 32px));
  background:var(--raised);border:1px solid var(--border);border-radius:var(--r-pop);box-shadow:var(--shadow-pop);
  padding:10px 14px;display:none;gap:10px;align-items:flex-start}
.toast.on{display:flex}
.toast b{font-weight:600}

/* ---------- Shared primitives ---------- */
.tile{width:var(--glyph-tile);height:var(--glyph-tile);border-radius:var(--r-key);background:var(--tile,var(--t-system));display:inline-grid;place-items:center;flex:none}
.kbd{display:inline-flex;gap:3px;flex:none}
.kbd kbd{font:500 var(--fs-caption)/1 var(--font-mono);min-width:20px;height:20px;padding:0 5px;border-radius:var(--r-key);
  border:1px solid var(--border);border-bottom-width:2px;background:var(--raised);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.btn{height:32px;padding:0 12px;border-radius:var(--r-row);border:1px solid var(--control-border);background:var(--raised);color:var(--text);
  font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background var(--state-ms) var(--ease)}
.btn:hover{background:var(--selection)}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,var(--text))}
.btn.primary .kbd kbd{background:transparent;border-color:color-mix(in srgb,var(--accent-text) 45%,transparent);color:var(--accent-text)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--selection)}
.btn.danger{color:var(--danger)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55}
.btn[disabled]:hover{background:var(--raised)}
.ibtn{width:32px;height:32px;border-radius:var(--r-row);border:1px solid transparent;background:transparent;color:var(--muted);display:inline-grid;place-items:center;flex:none}
.ibtn:hover{background:var(--selection);color:var(--text)}
.inp{height:32px;border:1px solid var(--control-border);border-radius:var(--r-row);background:var(--bg);padding:0 10px;color:var(--text);min-width:0;width:100%}
.inp::placeholder,.q::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
.field{display:grid;gap:6px}
.field>label,.flabel{font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:500;color:var(--text)}
.help{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--muted)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.seg{display:inline-flex;border:1px solid var(--control-border);border-radius:var(--r-row);overflow:hidden;flex:none}
.seg button{height:30px;padding:0 12px;border:0;background:transparent;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button+button{border-left:1px solid var(--control-border)}
.seg button[aria-pressed=true]{background:var(--selection);color:var(--text);box-shadow:inset 0 -2px 0 var(--rail-c)}
.seg button:focus-visible{outline-offset:-2px}
.vsep{width:1px;height:16px;background:var(--divider);flex:none}
.skel{display:block;height:10px;border-radius:var(--r-key);background:var(--selection)}

/* Group caption: starts on the title column (hanging alignment) */
.gcap{height:var(--gcap-h);display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:0 10px 6px calc(8px + var(--glyph-track) + 8px);
  font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.gcap .n{font-family:var(--font-mono);letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.gcap.flush{padding-left:12px}

/* Row: 32px glyph track | title+subtitle | accessory | keys */
.row{position:relative;height:var(--row-h);display:grid;grid-template-columns:var(--glyph-track) minmax(0,1fr) auto auto;column-gap:8px;align-items:center;
  padding:0 10px 0 8px;border-radius:var(--r-row);border:0;background:transparent;color:var(--text);width:100%;text-align:left;
  transition:background var(--state-ms) var(--ease)}
.row>.tile,.row>.ic,.row>.lead{justify-self:center}
.row:hover{background:color-mix(in srgb,var(--selection) 50%,transparent)}
.row[aria-selected=true],.row[aria-current=true]{background:var(--selection)}
.row[aria-selected=true]::before,.row[aria-current=true]::before,.node[aria-pressed=true]::before,.ecell[aria-selected=true]::before{
  content:"";position:absolute;left:var(--rail-inset);top:10px;bottom:10px;width:var(--rail);border-radius:1px;background:var(--rail-c)}
.tt{display:flex;align-items:baseline;gap:8px;min-width:0}
.tt .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;max-width:70%}
.tt .s{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 0;min-width:0}
.tt .s.mono{font-size:var(--fs-caption)}
.tt .t:last-child{max-width:100%}
.acc{font-size:var(--fs-caption);color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.acc .ic{width:14px;height:14px}
.row:focus-visible{outline-offset:-2px}

/* State plate: shape-coded glyph + eyebrow + title + body + detail + actions */
.plate{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:12px;row-gap:4px;padding:var(--s4);max-width:520px;text-align:left}
.plate.center{margin:auto}
.plate .pg{grid-row:1/span 2;align-self:start;margin-top:0;color:var(--tone)}
.plate .pg .ic{width:20px;height:20px}
.plate .eb{font-size:var(--fs-caption);line-height:var(--lh-caption);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tone)}
.plate h3{margin:0;font-size:var(--fs-emph);line-height:var(--lh-emph);font-weight:600;color:var(--text);grid-column:2}
.plate p{margin:0;color:var(--muted);grid-column:2}
.plate .dt{grid-column:2;font:var(--fs-caption)/var(--lh-caption) var(--font-mono);color:var(--muted);margin-top:4px}
.plate .pa{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.plate.band{max-width:none;border-radius:var(--r-row);background:var(--tint);padding:12px 14px;margin:6px 0}
.plate.band .pa{margin-top:8px}
.doc>.plate.band{margin:0 0 24px}
.tone-muted{--tone:var(--muted);--tint:var(--raised)}
.tone-danger{--tone:var(--danger);--tint:var(--tint-danger)}
.tone-warning{--tone:var(--warning);--tint:var(--tint-warning)}
.tone-focus{--tone:var(--focus);--tint:var(--tint-info)}
.tone-success{--tone:var(--success);--tint:var(--tint-success)}
.spin{transform-origin:50% 50%;animation:spin 900ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Launcher shell ---------- */
.shell{position:relative;width:min(var(--launcher-w),100%);max-height:var(--launcher-max-h);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-shell);box-shadow:var(--shadow-shell),var(--hl);overflow:hidden}
.qh{position:relative;height:var(--header-h);flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;border-bottom:1px solid var(--divider)}
.qh>.ic{color:var(--muted);width:20px;height:20px}
.qh:focus-within>.ic{color:var(--text)}
.qwrap{position:relative;flex:1;min-width:0;display:flex;align-items:center;height:100%}
.q{width:100%;height:100%;border:0;background:transparent;outline:none;font-size:var(--fs-emph);line-height:var(--lh-emph);font-weight:500;color:var(--text);padding:0}
.qwrap::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--focus);opacity:0;transition:opacity var(--state-ms) var(--ease)}
.qwrap:has(.q:focus-visible)::after{opacity:1}
.scope{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px 0 6px;border-radius:var(--r-row);background:var(--raised);border:1px solid var(--border);
  font-weight:500;white-space:nowrap;flex:none}
.scope .tile{width:16px;height:16px}
.scope .tile .tg{width:12px;height:12px}
.back{width:28px;height:28px}
.askai{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 10px;border-radius:var(--r-row);border:1px solid transparent;background:transparent;color:var(--muted);font-size:var(--fs-caption);font-weight:500;white-space:nowrap}
.askai:hover{background:var(--selection);color:var(--text)}
.hair{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden}
.hair i{position:absolute;top:0;bottom:0;width:30%;background:var(--accent);animation:hair 1.1s var(--ease) infinite}
@keyframes hair{from{left:-30%}to{left:100%}}
.results{flex:1;min-height:0;overflow:auto;padding:4px 8px 8px;scroll-padding:8px}
.results:focus-visible{outline-offset:-2px}
.foot{height:var(--footer-h);flex:none;display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;border-top:1px solid var(--divider);background:var(--raised);font-size:var(--fs-caption)}
.foot .ctx{display:flex;align-items:center;gap:8px;min-width:0;flex:1;color:var(--muted)}
.foot .ctx b{color:var(--text);font-weight:500}
.foot .ctx span{white-space:nowrap}
.foot .ctx .tile{width:16px;height:16px}
.foot .ctx .tile .tg{width:12px;height:12px}
.fbtn{height:28px;display:inline-flex;align-items:center;gap:8px;padding:0 4px 0 10px;border-radius:var(--r-row);border:0;background:transparent;color:var(--text);font-size:var(--fs-caption);font-weight:500;white-space:nowrap;flex:none}
.fbtn:hover{background:var(--selection)}
.fbtn[disabled]{color:var(--muted)}

/* Action panel (280px popover) */
.ap{position:absolute;right:8px;bottom:calc(var(--footer-h) + 8px);width:min(var(--action-w),calc(100% - 16px));max-height:calc(100% - var(--header-h) - var(--footer-h) - 16px);
  display:flex;flex-direction:column;background:var(--raised);border:1px solid var(--border);border-radius:var(--r-pop);box-shadow:var(--shadow-pop),var(--hl);overflow:hidden;z-index:5}
.ap.anim,.slash.anim{animation:apIn var(--panel-ms) var(--ease)}
@keyframes apIn{from{opacity:0;transform:translateY(var(--panel-offset))}to{opacity:1;transform:none}}
.ap-h{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:var(--fs-caption);color:var(--muted);border-bottom:1px solid var(--divider)}
.ap-l{flex:1;min-height:0;overflow:auto;padding:4px;margin:0;list-style:none}
.ap-i{position:relative;height:var(--action-row);display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;column-gap:8px;padding:0 8px 0 6px;border-radius:var(--r-row);color:var(--text)}
.ap-i>.ic{justify-self:center;color:var(--muted)}
.ap-i:hover{background:color-mix(in srgb,var(--selection) 50%,transparent)}
.ap-i[aria-selected=true]{background:var(--selection)}
.ap-i[aria-selected=true]::before{content:"";position:absolute;left:2px;top:9px;bottom:9px;width:var(--rail);border-radius:1px;background:var(--rail-c)}
.ap-i[aria-selected=true]>.ic{color:var(--text)}
.ap-i.danger,.ap-i.danger>.ic{color:var(--danger)}
.ap-sep{height:1px;background:var(--divider);margin:4px 6px}
.ap-f{height:var(--action-filter);flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-top:1px solid var(--divider)}
.ap-f input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%}
.ap-f:focus-within{box-shadow:inset 0 2px 0 var(--focus)}

/* List / detail */
.ld{flex:1;min-height:0;display:grid;grid-template-columns:var(--ld-cols,minmax(240px,42%) auto minmax(280px,1fr))}
.ld .results{border:0}
.sep{width:9px;cursor:col-resize;position:relative;background:transparent;border:0;padding:0}
.sep::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--divider)}
.sep:hover::before,.sep:focus-visible::before{background:var(--control-border);width:1px}
.sep:focus-visible{outline-offset:-2px}
.detail{min-width:0;overflow:auto;display:flex;flex-direction:column}
.preview{padding:16px 20px;border-bottom:1px solid var(--divider)}
.preview h4{margin:0 0 8px;font-size:var(--fs-emph);line-height:var(--lh-emph);font-weight:600}
.preview ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.preview li{display:flex;gap:8px;align-items:flex-start}
.preview li .ck{margin-top:2px;width:14px;height:14px;border:1.5px solid var(--control-border);border-radius:var(--r-key);flex:none;display:grid;place-items:center}
.preview li .ck.on{background:var(--muted);border-color:var(--muted)}
.preview li .ck.on .ic{width:10px;height:10px;color:var(--surface)}
.preview li.done span{color:var(--muted)}
.meta{margin:0;padding:8px 20px 16px;display:grid;grid-template-columns:auto 1fr;column-gap:0}
.meta dt{padding-right:16px!important}
.meta dt,.meta dd{margin:0;padding:7px 0;border-bottom:1px solid var(--divider);font-size:var(--fs-caption);line-height:var(--lh-caption)}
.meta dt{color:var(--muted)}
.meta dd{color:var(--text);text-align:right;min-width:0;overflow-wrap:anywhere}
.meta .cap{grid-column:1/-1;font-size:var(--fs-caption);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 0 4px;font-weight:500}

/* Emoji grid */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px;padding:0 4px}
.ecell{position:relative;height:72px;border-radius:var(--r-row);border:0;background:transparent;display:grid;place-items:center;font-family:var(--font-emoji);font-size:32px;line-height:1}
.ecell:hover{background:color-mix(in srgb,var(--selection) 50%,transparent)}
.ecell[aria-selected=true]{background:var(--selection)}
.ecell[aria-selected=true]::before{top:auto;bottom:6px;left:50%;width:20px;height:2px;transform:translateX(-50%)}
.ecell:focus-visible{outline-offset:-2px}
.ecell.sk{background:var(--raised)}
.ecap{grid-column:1/-1;padding-left:8px!important}

/* ---------- Workspace frame ---------- */
.ws{position:relative;width:min(1180px,100%);height:680px;display:grid;grid-template-rows:var(--header-h) minmax(0,1fr);background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-shell);box-shadow:var(--shadow-shell),var(--hl);overflow:hidden}
.wsh{display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;border-bottom:1px solid var(--divider);min-width:0}
.wsh .ttl{font-size:var(--fs-emph);line-height:var(--lh-emph);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wsh .grow{flex:1;min-width:8px}
.wsb{display:grid;min-height:0;min-width:0}
.side{background:var(--bg);border-right:1px solid var(--divider);display:flex;flex-direction:column;min-height:0;min-width:0}
.side-h{padding:12px 12px 4px;display:grid;gap:8px}
.side .results{padding:4px 8px 12px}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.idchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--r-key);border:1px solid var(--border);font-size:var(--fs-caption);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* Chat */
.msgs{flex:1;min-height:0;overflow:auto;padding:24px 24px 8px}
.col{max-width:var(--measure);margin:0 auto;display:grid;gap:20px}
.who{display:flex;align-items:center;gap:8px;font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--muted);margin-bottom:6px}
.who .tile{width:16px;height:16px}.who .tile .tg{width:12px;height:12px}
.umsg{justify-self:end;max-width:86%;background:var(--user-msg);border-radius:var(--r-pop);padding:10px 14px}
.prose{line-height:var(--lh-prose)}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.prose li{margin-bottom:4px}
.prose code{font-family:var(--font-mono);font-size:13px;background:var(--raised);border:1px solid var(--divider);border-radius:var(--r-key);padding:0 4px}
.tool{border:1px solid var(--divider);border-radius:var(--r-row);background:var(--tool-surface);margin:0 0 12px}
.tool>summary{list-style:none;height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;cursor:default;font-size:var(--fs-caption)}
.tool>summary::-webkit-details-marker{display:none}
.tool>summary .chev{transition:transform var(--state-ms) var(--ease);color:var(--muted)}
.tool[open]>summary .chev{transform:rotate(90deg)}
.tool>summary:focus-visible{outline-offset:-2px;border-radius:var(--r-row)}
.tool .tb{padding:4px 12px 12px 34px;display:grid;gap:8px;font-size:var(--fs-caption);line-height:var(--lh-caption)}
.tool pre{margin:0;font:var(--fs-caption)/var(--lh-caption) var(--font-mono);background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-key);padding:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.stat{display:inline-flex;align-items:center;gap:6px;color:var(--tone);font-weight:500}
.stat .ic{width:14px;height:14px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--fs-caption);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:var(--r-key);background:var(--raised);border:1px solid var(--border);font-size:var(--fs-caption);color:var(--text);white-space:nowrap;max-width:100%}
.chip .ic{width:14px;height:14px;color:var(--muted)}
.comp-wrap{padding:8px 24px 16px}
.comp{max-width:var(--measure);margin:0 auto;border:1px solid var(--control-border);border-radius:var(--r-pop);background:var(--raised);padding:8px;display:grid;gap:6px}
.comp:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.comp textarea{border:0;background:transparent;outline:none;resize:none;min-height:44px;padding:4px 6px;line-height:var(--lh-body)}
.comp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.comp-row .grow{flex:1;min-width:0}
.comp-row .idchip{flex:0 1 auto;min-width:0}
.comp-row.last{flex-wrap:nowrap}
.comp-row.last>*{flex-shrink:0}
.comp-row.last>.idchip,.comp-row.last>.ctxline{flex-shrink:1;min-width:0;overflow:hidden}
.ctxline .ell,.idchip .ell{display:block}
.ctxline{font-size:var(--fs-caption);color:var(--muted);display:inline-flex;gap:6px;align-items:center}

/* Notes */
.editor{flex:1;min-height:0;overflow:auto;padding:28px 32px}
.doc{max-width:var(--measure);margin:0 auto;position:relative}
.doc h1{margin:0;font-size:var(--fs-ws);line-height:var(--lh-ws);font-weight:600;letter-spacing:-.01em}
.doc h2{margin:20px 0 8px;font-size:var(--fs-emph);line-height:var(--lh-emph);font-weight:600}
.doc .dm{font-size:var(--fs-caption);color:var(--muted);margin:6px 0 18px;display:flex;gap:12px;flex-wrap:wrap}
.doc p{margin:0 0 10px;line-height:var(--lh-prose)}
.tasks{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:2px}
.tasks label{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 6px;border-radius:var(--r-row)}
.tasks label:hover{background:color-mix(in srgb,var(--selection) 50%,transparent)}
.tasks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.slashline{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 6px;border-radius:var(--r-row);background:color-mix(in srgb,var(--selection) 50%,transparent)}
.slashline input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:32px}
.slash{position:absolute;left:6px;width:min(var(--action-w),100%);background:var(--raised);border:1px solid var(--border);border-radius:var(--r-pop);box-shadow:var(--shadow-pop),var(--hl);overflow:hidden;z-index:4}
.savest{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption);color:var(--muted);white-space:nowrap}
.savest .ic{width:14px;height:14px}

/* Workflow */
.wf{grid-template-columns:var(--side-w) minmax(0,1fr) var(--insp-w)}
.pal .gcap{padding-left:12px}
.pal-i{height:var(--action-row);grid-template-columns:24px minmax(0,1fr) auto}
.canvas-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.ctool{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--divider);background:var(--surface);min-width:0}
.ctool .help{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.canvas{flex:1;min-height:0;overflow:auto;position:relative;background-color:var(--canvas);
  background-image:radial-gradient(circle,var(--canvas-dot) 1px,transparent 1.3px);background-size:16px 16px}
.cin{position:relative;width:600px;height:560px;margin:0 auto}
.cin svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--control-border);stroke-width:1.5}
.edge.bad{stroke:var(--danger);stroke-dasharray:5 4}
.elabel{position:absolute;transform:translate(-50%,-50%);font:500 var(--fs-caption)/1 var(--font-mono);color:var(--muted);background:var(--canvas);padding:3px 6px;border-radius:var(--r-key);border:1px solid var(--divider);white-space:nowrap}
.elabel.bad{color:var(--danger);border-color:var(--danger)}
.node{position:absolute;width:var(--node-w);height:92px;border:1px solid var(--border);border-radius:var(--r-row);background:var(--raised);padding:10px 12px 10px 14px;text-align:left;color:var(--text);display:grid;grid-template-rows:auto auto auto;gap:2px;box-shadow:0 1px 2px #0000001F}
.node:hover{border-color:var(--control-border)}
.node[aria-pressed=true]{background:var(--selection);border-color:var(--control-border)}
.node .nh{display:flex;align-items:center;gap:8px;font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.node .nt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nc{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .nb{position:absolute;right:8px;top:8px}
.port{position:absolute;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;border:1.5px solid var(--control-border);background:var(--surface)}
.port.in{top:-6px}.port.out{bottom:-6px}
.node.sk{background:var(--raised);border-style:dashed}
.insp{border-left:1px solid var(--divider);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface)}
.insp-h{padding:12px 16px;border-bottom:1px solid var(--divider);display:grid;gap:10px}
.insp-b{flex:1;overflow:auto;padding:16px;display:grid;gap:16px;align-content:start}
.insp textarea.inp{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:var(--lh-body)}
.ro{min-height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px dashed var(--border);border-radius:var(--r-row);color:var(--muted);font-size:var(--fs-caption)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:var(--fs-caption);line-height:var(--lh-caption);margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.slist{flex:1;overflow:auto;padding:12px;background:var(--surface)}
.slist ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.srow{display:grid;grid-template-columns:28px var(--glyph-track) minmax(0,1fr) auto;align-items:center;column-gap:8px;min-height:56px;padding:6px 8px;border-radius:var(--r-row);position:relative}
.srow[aria-current=true]{background:var(--selection)}
.srow[aria-current=true]::before{content:"";position:absolute;left:var(--rail-inset);top:14px;bottom:14px;width:var(--rail);border-radius:1px;background:var(--rail-c)}
.srow .ix{font:500 var(--fs-caption)/1 var(--font-mono);color:var(--muted);text-align:right}
.srow .st{font-size:var(--fs-caption);line-height:var(--lh-caption);color:var(--muted)}
.srow .sa{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.srow .sa .btn{height:28px;padding:0 8px;font-size:var(--fs-caption)}
.srow .selbtn{border:0;background:transparent;text-align:left;padding:0;display:grid;gap:2px;min-width:0;color:var(--text)}
.srow .selbtn:focus-visible{outline-offset:4px;border-radius:var(--r-key)}

/* Settings */
.set{grid-template-columns:var(--side-w) minmax(0,1fr)}
.page{overflow:auto;padding:24px 32px 32px}
.main.page{display:block}
.page h1{margin:0 0 4px;font-size:var(--fs-ws);line-height:var(--lh-ws);font-weight:600;letter-spacing:-.01em}
.page>.lead{margin:0 0 20px;color:var(--muted);max-width:var(--measure)}
.card{border:1px solid var(--border);border-radius:var(--r-pop);background:var(--surface);margin:0 0 16px;max-width:820px;overflow:hidden}
.card-h{padding:14px 16px 10px;display:flex;align-items:flex-start;gap:12px}
.card-h h2{margin:0;font-size:var(--fs-emph);line-height:var(--lh-emph);font-weight:600}
.card-h p{margin:2px 0 0;color:var(--muted)}
.caps{list-style:none;margin:0;padding:0}
.caps li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr) 140px;align-items:center;gap:12px;min-height:52px;padding:8px 16px;border-top:1px solid var(--divider)}
.caps .cn{font-weight:500}
.caps .cb{font:var(--fs-caption)/var(--lh-caption) var(--font-mono);color:var(--muted);overflow-wrap:anywhere}
.caps li>.btn{justify-self:end}
.perm-band{background:var(--tint-info);padding:12px 16px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--divider)}
.perm-band .ic{width:20px;height:20px;color:var(--focus);flex:none}
.perm-band b{display:block;font-size:var(--fs-emph);line-height:var(--lh-emph)}
.pdl{margin:0;padding:8px 16px;display:grid;grid-template-columns:minmax(120px,auto) 1fr;column-gap:16px}
.pdl dt,.pdl dd{padding:8px 0;border-bottom:1px solid var(--divider);margin:0}
.pdl dt{color:var(--muted);font-size:var(--fs-caption)}
.pdl dd{min-width:0;overflow-wrap:anywhere}
.quote{border-left:2px solid var(--border);padding-left:10px;color:var(--text);font-style:italic}
fieldset{border:0;margin:0;padding:8px 16px 4px;display:grid;gap:4px}
legend{font-size:var(--fs-caption);font-weight:500;padding:0;margin-bottom:6px}
.opt{display:grid;grid-template-columns:16px 1fr;column-gap:10px;align-items:start;padding:8px 10px;border-radius:var(--r-row);border:1px solid transparent}
.opt:hover{background:color-mix(in srgb,var(--selection) 50%,transparent)}
.opt:has(input:checked){background:var(--selection);border-color:var(--border)}
.opt input{margin-top:2px}
.opt small{grid-column:2;color:var(--muted);font-size:var(--fs-caption);line-height:var(--lh-caption)}
.card-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--divider);flex-wrap:wrap}

/* ---------- Narrow review (390px) ---------- */
@media (max-width:600px){
  .rv-id{flex-basis:100%}
  .stage{padding:12px 8px 20px}
  .row{grid-template-columns:var(--glyph-track) minmax(0,1fr) auto}
  .row .acc.hide-n{display:none}
  .tt .s{display:none}
  .tt .t{max-width:100%}
  .askai .lbl{display:none}
  .foot .fbtn .lbl{display:none}
  .ld{--ld-cols:1fr!important;grid-template-rows:minmax(150px,auto) minmax(0,1fr)}
  .ld .sep{display:none}
  .ld .results{max-height:220px;border-bottom:1px solid var(--divider)}
  .ws{height:auto;min-height:0}
  .wsb{grid-template-columns:1fr!important}
  .side{border-right:0;border-bottom:1px solid var(--divider)}
  .side .results{max-height:168px}
  .insp{border-left:0;border-top:1px solid var(--divider)}
  .pal .results{max-height:150px}
  .canvas{min-height:420px}
  .msgs,.editor,.page{padding-left:16px;padding-right:16px}
  .comp-wrap{padding-left:12px;padding-right:12px}
  .comp-row.last{flex-wrap:wrap}
  .comp-row.last>.idchip{display:none}
  .caps li{grid-template-columns:1fr auto;}
  .caps .cb{grid-column:1/-1}
  .pdl{grid-template-columns:1fr}
  .pdl dt{border-bottom:0;padding-bottom:0}
  .wsh .hide-n,.wsh .kbd,.wsh .savest{display:none}
  .wsh .ttl{flex:0 1 auto;min-width:72px}
  .srow{grid-template-columns:28px var(--glyph-track) minmax(0,1fr)}
  .srow .sa{grid-column:3;justify-content:flex-start;margin-left:-8px}
  .meta{grid-template-columns:1fr 1fr}
}

/* ---------- Reduced motion: opacity only, no translation, static progress ---------- */
html[data-motion=reduced] *{transition-duration:0ms!important}
html[data-motion=reduced] .ap.anim,html[data-motion=reduced] .slash.anim{animation:fadeIn var(--panel-ms) linear}
html[data-motion=reduced] .spin{animation:none}
html[data-motion=reduced] .hair i{animation:none;left:0;width:40%}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- Forced colours ---------- */
@media (forced-colors:active){
  .shell,.ws,.ap,.slash,.card,.node,.toast{border:1px solid CanvasText}
  .tile{background:Canvas;border:1px solid CanvasText}
  .tg{color:CanvasText}
  .row[aria-selected=true],.row[aria-current=true],.ap-i[aria-selected=true],.ecell[aria-selected=true],.srow[aria-current=true],.node[aria-pressed=true]{outline:2px solid Highlight;outline-offset:-2px}
  .row[aria-selected=true]::before,.row[aria-current=true]::before,.ap-i[aria-selected=true]::before,.node[aria-pressed=true]::before,.srow[aria-current=true]::before,.ecell[aria-selected=true]::before{forced-color-adjust:none;background:Highlight}
  .kbd kbd,.btn,.seg,.inp,.comp,.chip,.idchip,.scope{border:1px solid ButtonText}
  .plate.band{border:1px solid CanvasText}
  .qwrap::after,.hair i{background:Highlight}
  .edge{stroke:CanvasText}.edge.bad{stroke:Mark}
}
</style>
</head>
<body>
<header class="rv" aria-label="Design review controls (not product UI)">
  <div class="rv-in">
    <div class="rv-id">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--raised)" stroke="var(--border)"/><path d="M9 12l4 4-4 4" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 21h7" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/><rect x="18" y="8" width="7" height="5" rx="1.5" fill="none" stroke="var(--muted)" stroke-width="1.5"/></svg>
      <div><b>Linuxcast design review — “Instrument”</b><span>Opus 5.5 candidate · raycast-refresh proposal · not live</span></div>
    </div>
    <span class="badge" title="All names, numbers and results are synthetic. Buttons only change the local mock or show a ‘Simulated’ notice."><svg class="ic" viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px"><rect x="2.5" y="2.5" width="11" height="11" rx="2" stroke-dasharray="2 2"/></svg>Synthetic content · simulated actions</span>
    <div class="rv-ctl">
      <label class="rv-field" for="stateSel">State
        <select id="stateSel" class="sel">
          <option value="default">Default</option>
          <option value="loading">Loading</option>
          <option value="empty">Empty / filtered-empty</option>
          <option value="error">Error</option>
          <option value="denied">Permission denied</option>
          <option value="unsupported">Unsupported</option>
          <option value="interrupted">Interrupted</option>
        </select>
      </label>
      <button id="themeBtn" class="btn" type="button" aria-pressed="false"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11" /><path d="M8 2.5a5.5 5.5 0 010 11z" fill="currentColor" stroke="none"/></svg><span id="themeLbl">Light theme</span></button>
      <button id="motionBtn" class="btn" type="button" aria-pressed="false"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8h3l1.5-3 2 6 1.5-3h3"/></svg>Reduce motion</button>
    </div>
  </div>
  <div class="rv-tabs" role="tablist" aria-label="Surface">
    <button class="rv-tab" role="tab" id="tab-launcher" data-view="launcher" aria-controls="stage"><span class="n">1</span>Launcher + actions</button>
    <button class="rv-tab" role="tab" id="tab-files" data-view="files" aria-controls="stage"><span class="n">2</span>Files list/detail</button>
    <button class="rv-tab" role="tab" id="tab-emoji" data-view="emoji" aria-controls="stage"><span class="n">3</span>Emoji grid</button>
    <button class="rv-tab" role="tab" id="tab-chat" data-view="chat" aria-controls="stage"><span class="n">4</span>AI chat</button>
    <button class="rv-tab" role="tab" id="tab-notes" data-view="notes" aria-controls="stage"><span class="n">5</span>Notes</button>
    <button class="rv-tab" role="tab" id="tab-workflow" data-view="workflow" aria-controls="stage"><span class="n">6</span>Workflow editor</button>
    <button class="rv-tab" role="tab" id="tab-settings" data-view="settings" aria-controls="stage"><span class="n">7</span>Settings + permissions</button>
  </div>
</header>
<main id="stage" class="stage" role="tabpanel" tabindex="-1"></main>
<div class="notes" id="notes" aria-label="Review notes for this view"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ icons
   Original 16-unit line glyphs, 1.5px non-scaling stroke. No third-party marks. */
const I={
 search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
 file:'<path d="M4 1.75h5l3 3v9.5H4z"/><path d="M9 1.75v3h3"/>',
 doc:'<path d="M4 1.75h5l3 3v9.5H4z"/><path d="M9 1.75v3h3M6 8.5h4M6 11h4"/>',
 deck:'<rect x="2" y="3" width="12" height="8" rx="1.25"/><path d="M8 11v2.5M5.5 13.5h5"/>',
 table:'<rect x="2.25" y="2.75" width="11.5" height="10.5" rx="1.25"/><path d="M2.25 6.5h11.5M2.25 10h11.5M6.5 6.5v6.75"/>',
 text:'<path d="M3 3.5h10M3 6.5h10M3 9.5h10M3 12.5h6"/>',

function actionPanel(kind,title,st){
  const groups=ACTIONS[kind]||ACTIONS.command;

  let flat=[];let html='';
  groups.forEach((g,gi)=>{
    const items=g.filter(a=>!q||a.l.toLowerCase().includes(q));
    if(!items.length)return;

      html+=`<li class="ap-i ${a.d?'danger':''}" role="option" id="api-${idx}" data-act="apitem" data-arg="${idx}" aria-selected="${idx===st.apSel}" aria-label="${esc(a.l)}${a.d?' (destructive)':''}${a.k?', '+esc(kbLabel(a.k)):''}">${ic(a.i)}<span class="ell">${esc(a.l)}</span>${kb(a.k)}</li>`});
  });

      <div class="prose"><p>I couldn’t read <b>Launch checklist.md</b> because file access was denied. If you paste the checklist text or allow access, I can summarise it.</p></div></div>`+
      plate({kind:'denied',band:1,title:'File access denied for this chat',body:'The assistant answered without the file. You can allow it next time it asks.',actions:[{label:'Ask again',msg:'would let the assistant request the file read again'}]});
    else if(st==='interrupted') thread+=`<div>${who}${toolDone}<div class="prose"><p>The checklist has <b>five items</b>; two are complete.</p><ul><li><b>Done:</b> shared contracts are frozen, and dark and light screenshots are recorded.</li><li><b>Open:</b> validate on GNOME 48 (Wayland) and KDE Pla…</li></ul></div></div>`+
      plate({kind:'interrupted',band:1,title:'Response interrupted — partial answer',body:'The connection to the configured provider closed. The text above is incomplete and stays marked as such. Nothing was resent automatically.',actions:[{label:'Retry',icon:'retry',msg:'would resend to the configured provider'},{label:'Copy partial text',ghost:1,icon:'copy',msg:'would copy the partial answer, marked incomplete'}]});
    else thread+=`<div>${who}${toolDone}${answer}</div>`;
  }
  const canSend=!(st==='unsupported'||st==='loading');
  const composer=`<div class="comp-wrap"><div class="comp">
    ${st!=='unsupported'?`<div class="comp-row"><span class="chip">${ic('doc')}Launch checklist.md · 2.1 KB<button type="button" class="ibtn" style="width:20px;height:20px" data-act="sim" data-msg="would remove the attachment from the next message" aria-label="Remove attachment Launch checklist.md">${ic('x')}</button></span><span class="ctxline">${ic('info')}<span class="ell">Will send: your message + this file</span></span></div>`:''}
    <label class="sr" for="ctext">Message</label>
    <textarea id="ctext" rows="2" placeholder="${st==='unsupported'?'Configure a provider in Settings → AI to start':'Ask a follow-up…'}" ${st==='unsupported'?'disabled':''}></textarea>
    <div class="comp-row last">
      <button type="button" class="btn ghost" data-act="sim" data-msg="would open the file chooser" ${st==='unsupported'?'disabled':''}>${ic('clip')}Attach</button>
      ${st==='unsupported'?'<span class="ctxline"><span class="ell">Nothing will be sent</span></span>':''}
      <span class="grow"></span>
      <span class="idchip" title="Set globally in Settings → AI. There is no per-chat model selector.">${ic('spark')}<span class="ell">${st==='unsupported'?'No provider configured':'Configured provider / configured model'}</span></span>
      ${st==='loading'?btn({label:'Stop',icon:'x',msg:'would cancel the pending response'}):btn({label:'Send',primary:1,icon:'send',keys:['Enter'],disabled:!canSend,msg:'would send the message and 1 file to the configured provider'})}
    </div></div></div>`;
  return `<div class="spec" style="--frame-w:1180px"><span>Workspace · chat · sidebar 240 · prose measure 680 · composer radius 12</span><span>Window controls come from the desktop; not drawn</span></div>
  <div class="ws"><div class="wsh">${tile('ai','spark')}<span class="ttl">${newChat?'New chat':'Summarise the launch checklist'}</span><span class="grow"></span><button type="button" class="ibtn hide-n" data-act="sim" data-msg="would open the chat action panel" aria-label="More actions (Ctrl+K)">${ic('more')}</button></div>
    <div class="wsb" style="grid-template-columns:var(--side-w) minmax(0,1fr)">${side}
      <section class="main" aria-label="Conversation"><div class="msgs"><div class="col">${thread}</div></div>${composer}</section></div></div>`;
}

function vNotes(){

  const side=`<aside class="side" aria-label="Notes">
    <div class="side-h"><button type="button" class="btn" data-act="sim" data-msg="would create a new note" aria-keyshortcuts="Control+N">${ic('plus')}New note${kb(['Ctrl','N'])}</button>
    <label class="sr" for="nq">Search notes</label><input id="nq" class="inp" placeholder="Search titles and content" value="${esc(q)}" autocomplete="off"></div>
    <div class="results">${list.length?`<div class="gcap flush">All notes<span class="n">${list.length}</span></div>`+sideRows(list,st==='empty'?'':N.sel,'n',n=>`<span style="display:grid;min-width:0"><span class="t ell" style="font-weight:500">${esc(n.t)}</span></span><span class="acc">${esc(n.when)}</span>`):
      plate({kind:'filtered',title:`No notes match “${esc(q)}”`,body:'Search covers titles and content.',actions:[{label:`Create “${esc(q)}”`,msg:'would create a note with that title'}]})}</div></aside>`;
  let save={kind:'success',label:'Saved locally'};
  let band='';
  if(st==='error'){save={kind:'error',label:'Not saved'};band=plate({kind:'error',band:1,title:'Not saved — 2 edits exist only in this window',body:'Writing to the notes database failed (disk full, synthetic). Keep this window open and retry, or copy the text somewhere safe.',actions:[{label:'Retry save',primary:1,icon:'retry',msg:'would retry writing the note'},{label:'Copy note text',ghost:1,icon:'copy',msg:'would copy the note as Markdown'}]})}
  if(st==='denied') band=plate({kind:'denied',band:1,title:'Export to <span class="mono">~/Documents/Linuxcast/</span> was denied',body:'That folder isn’t writable by your account. The note itself is unchanged; choose another folder to export.',actions:[{label:'Choose another folder…',msg:'would open the desktop file chooser'}]});
  if(st==='unsupported') band=plate({kind:'unsupported',band:1,title:'Dictation isn’t set up',body:'No local speech model is installed. Linuxcast doesn’t send audio to a remote service unless you configure one separately.',detail:'local speech: not configured',actions:[{label:'Set up local speech',msg:'would open Settings → Local speech'}]});
  if(st==='interrupted') {save={kind:'interrupted',label:'Recovered draft'};band=plate({kind:'interrupted',band:1,title:'Recovered unsaved changes',body:'Linuxcast closed while you were editing. A recovered draft from 09:41 differs from the saved note by 2 lines.',actions:[{label:'Compare',msg:'would show a side-by-side comparison'},{label:'Keep recovered',msg:'would replace the saved note with the recovered draft'},{label:'Discard recovered',ghost:1,danger:1,msg:'would discard the recovered draft after confirmation'}]})}
  const T=N.tasks;
  const task=(id,label)=>`<li><label><input type="checkbox" data-act="ntask" data-arg="${id}" ${T[id]?'checked':''}><span>${label}</span></label></li>`;
  const slashItems=[['Heading','format'],['Task list','check'],['Code block','command'],['Quote','text'],['Insert date','clock'],['Link to note','link']];
  const sq=N.slash.startsWith('/')?N.slash.slice(1).toLowerCase():null;
  const sflat=sq===null?[]:slashItems.filter(([l])=>l.toLowerCase().includes(sq));

  let doc;
  if(st==='loading') doc=`<div class="doc" aria-hidden="true"><span class="skel" style="width:46%;height:24px;margin-bottom:20px"></span>${[90,84,70,60,76,52].map(w=>`<span class="skel" style="width:${w}%;margin:14px 0"></span>`).join('')}</div><span class="sr" role="status">Opening Launch checklist</span>`;
  else if(st==='empty') doc=`<div style="display:flex;min-height:420px">${plate({kind:'empty',center:1,eyebrow:'Nothing open',title:'No note selected',body:'Choose a note, or press Ctrl+N to create one.'})}</div>`;
  else doc=`<article class="doc" aria-label="Note: Launch checklist (synthetic content)">${band}
    <h1>Launch checklist</h1>
    <div class="dm"><span>Created 28 Oct 2026</span><span class="num">86 words</span><span>Local note</span></div>
    <p>Everything that must be true before the first public build. Desktop checks need a real session, not a headless browser.</p>
    <h2>Evidence</h2>
    <ul class="tasks">${task('t1','Freeze shared contracts')}${task('t2','Record dark and light screenshots')}</ul>
    <h2>Before tagging</h2>
    <ul class="tasks">${task('t3','Validate on GNOME 48, Wayland')}${task('t4','Validate on KDE Plasma 6.3, X11')}${task('t5','Confirm privileged input is disabled and stopped')}</ul>
    <p>Run <code class="mono" style="font-size:13px">python3 scripts/validate_plan.py</code> after any task change.</p>
    <div style="position:relative">
      <div class="slashline">${ic('plus','ic muted')}<label class="sr" for="slash">Next line (type / for blocks)</label><input id="slash" value="${esc(N.slash)}" placeholder="Type / for blocks" autocomplete="off" role="combobox" aria-expanded="${sq!==null}" aria-controls="slm" aria-activedescendant="${sflat.length?'sl-'+N.slashSel:''}"></div>
      ${sq!==null?`<div class="slash${N._anim?' anim':''}" style="bottom:38px"><div class="ap-h">Insert block</div><ul class="ap-l" role="listbox" id="slm" aria-label="Insert block">${sflat.length?sflat.map(([l,i],ix)=>`<li class="ap-i" role="option" id="sl-${ix}" aria-selected="${ix===N.slashSel}" data-act="slashpick" data-arg="${esc(l)}">${ic(i)}<span>${esc(l)}</span></li>`).join(''):`<li class="ap-i" role="presentation"><span></span><span class="muted">No blocks match</span></li>`}</ul></div>`:''}
    </div>
  </article>`;
  return `<div class="spec" style="--frame-w:1180px"><span>Workspace · notes · editor measure 680 · title 28</span><span>Autosave status is quiet unless it fails</span></div>
  <div class="ws"><div class="wsh">${tile('notes','note')}<span class="ttl">${st==='empty'?'Notes':'Launch checklist'}</span>
    ${st!=='empty'&&st!=='loading'?`<span class="savest" role="status">${statusTag(save.kind,save.label)}</span>`:''}<span class="grow"></span>
    <button type="button" class="ibtn" data-act="sim" data-msg="${st==='unsupported'?'dictation is unavailable — no local speech model':'would start local dictation'}" aria-label="Dictate${st==='unsupported'?' (unavailable: no local speech model)':''}" ${st==='unsupported'?'aria-disabled="true" style="opacity:.55"':''}>${ic('mic')}</button>
    <button type="button" class="btn ghost hide-n" data-act="sim" data-msg="would pin the note">${ic('pin')}Pin</button>
    <button type="button" class="btn ghost hide-n" data-act="sim" data-msg="would open the export dialog">${ic('export')}Export…</button>
    <button type="button" class="btn" data-act="sim" data-msg="would open the note action panel" aria-keyshortcuts="Control+K">Actions${kb(['Ctrl','K'])}</button></div>
    <div class="wsb" style="grid-template-columns:var(--side-w) minmax(0,1fr)">${side}<section class="main" aria-label="Editor"><div class="editor">${doc}</div></section></div></div>`;
}

function nodeById(id){return NODES.find(n=>n.id===id)}
function vWorkflow(){
  const st=S.state;const W=S.w;
  const nodes=st==='empty'?[]:NODES;
  if(!nodes.find(n=>n.id===W.sel)&&nodes.length) W.sel=nodes[0].id;
  if(st==='interrupted'&&W.tab!=='debug') W.tab='debug';
  const cur=nodeById(W.sel);
  const pal=`<aside class="side pal" aria-label="Node palette">
    <div class="side-h"><label class="sr" for="pq">Search nodes</label><input id="pq" class="inp" placeholder="Search nodes  (Ctrl+Shift+A)" autocomplete="off"></div>
    <div class="results">${PALETTE.map(([g,l])=>`<div class="gcap">${g}<span class="n">${l.length}</span></div>`+l.map(p=>{const un=p.unsup&&st==='unsupported';
      return `<button type="button" class="row pal-i" data-act="sim" data-msg="${un?'Clipboard change is unavailable in this session':'would add “'+esc(p.t)+'” to the graph'}" ${un?'aria-disabled="true"':''} aria-label="Add ${esc(p.t)} node${un?' (unavailable in this session)':''}">${tile(p.tile,p.icon)}<span class="ell" style="font-weight:500;${un?'color:var(--muted)':''}">${esc(p.t)}</span>${un?`<span class="acc">${ic('st_unsupported')}Unavailable</span>`:ic('plus','ic muted')}</button>`}).join('')).join('')}</div></aside>`;
  const NH=92,NWd=208;
  const edgePath=(a,b)=>{const x1=a.x+NWd/2,y1=a.y+NH,x2=b.x+NWd/2,y2=b.y;const my=(y1+y2)/2;return `M${x1} ${y1} C${x1} ${my} ${x2} ${my} ${x2} ${y2}`};
  const mid=(a,b)=>[(a.x+b.x)/2+NWd/2,(a.y+NH+b.y)/2];
  let canvas;
  if(st==='loading') canvas=`<div class="cin" aria-hidden="true">${[[24,32],[288,160],[24,296]].map(([x,y])=>`<span class="node sk" style="left:${x}px;top:${y}px"><span class="skel" style="width:40%"></span><span class="skel" style="width:70%;margin-top:10px"></span></span>`).join('')}</div><span class="sr" role="status">Loading Morning brief</span>`;
  else if(st==='empty') canvas=`<div style="display:flex;min-height:100%;padding:24px">${plate({kind:'empty',center:1,eyebrow:'Empty workflow',title:'Start with a trigger',body:'Pick a trigger from the palette, or add a node by name with Ctrl+Shift+A. Keyboard users can build the whole graph from the structured list.',actions:[{label:'Add Schedule trigger',primary:1,msg:'would add a Schedule trigger node'},{label:'Use structured list',ghost:1,act:'wfmode',arg:'list'}]})}</div>`;
  else {
    const edges=EDGES.map(([a,b,t])=>{const A=nodeById(a),B=nodeById(b);return {d:edgePath(A,B),m:mid(A,B),t}});
    let bad='';
    if(st==='error'){const A=nodeById('n2'),B=nodeById('n4');bad=`<path class="edge bad" d="M${A.x+NWd} ${A.y+NH/2} C${A.x+NWd+56} ${A.y+NH/2} ${B.x+NWd+56} ${B.y+NH/2} ${B.x+NWd} ${B.y+NH/2}"/>`}
    canvas=`<div class="cin"><svg class="edges" aria-hidden="true">${edges.map(e=>`<path class="edge" d="${e.d}"/>`).join('')}${bad}</svg>
      ${edges.map(e=>`<span class="elabel" style="left:${e.m[0]}px;top:${e.m[1]}px" aria-hidden="true">${e.t}</span>`).join('')}
      ${st==='error'?`<span class="elabel bad" style="left:${288+NWd+42}px;top:${(160+432)/2+NH/2}px" aria-hidden="true">✕ Text → Notification</span>`:''}
      ${nodes.map(n=>{const flag=st==='interrupted'&&n.id==='n3'?statusTag('interrupted','Interrupted'):st==='interrupted'&&n.id==='n4'?`<span class="stat tone-muted">${ic('st_empty')}Not run</span>`:st==='error'&&n.id==='n4'?statusTag('error','Input invalid'):'';
        return `<button type="button" class="node" style="left:${n.x}px;top:${n.y}px" data-act="wsel" data-arg="${n.id}" aria-pressed="${n.id===W.sel}" aria-label="${esc(n.cat)} node: ${esc(n.t)}. ${esc(n.c)}. ${n.in?'Input '+n.in+'.':''} ${n.out?'Output '+n.out+'.':''}">
        ${n.in?'<span class="port in" aria-hidden="true"></span>':''}${n.out?'<span class="port out" aria-hidden="true"></span>':''}
        <span class="nh">${tile(n.tile,n.icon)}${esc(n.cat)}</span><span class="nt">${esc(n.t)}</span><span class="nc">${esc(n.c)}</span>${flag?`<span class="nb" style="font-size:var(--fs-caption)">${flag}</span>`:''}</button>`}).join('')}</div>`;
  }
  const slist=`<div class="slist"><div style="display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap"><b>Steps</b><span class="help">Same graph as the canvas, in execution order. No dragging required.</span><span style="flex:1"></span>${btn({label:'Add node…',icon:'plus',keys:['Ctrl','Shift','A'],msg:'would open the node search to add a step'})}</div>
    ${nodes.length?`<ol aria-label="Workflow steps">${nodes.map((n,ix)=>{const from=EDGES.find(e=>e[1]===n.id),to=EDGES.find(e=>e[0]===n.id);
      return `<li class="srow" aria-current="${n.id===W.sel}"><span class="ix">${ix+1}</span>${tile(n.tile,n.icon)}
      <button type="button" class="selbtn" data-act="wsel" data-arg="${n.id}" aria-label="Select step ${ix+1}: ${esc(n.t)}"><span style="font-weight:600">${esc(n.t)} <span class="muted" style="font-weight:400">· ${esc(n.cat)}</span></span>
      <span class="st">${from?`in ${esc(from[2])} from ${esc(nodeById(from[0]).t)}`:'Starts the workflow'} · ${to?`out ${esc(to[2])} to ${esc(nodeById(to[1]).t)}`:'Final step'}</span></button>
      <span class="sa">${btn({label:'Connect…',ghost:1,msg:'would open a list of compatible inputs for '+n.t})}${btn({label:'Move up',ghost:1,disabled:ix===0,msg:'would move the step up'})}${btn({label:'Move down',ghost:1,disabled:ix===nodes.length-1,msg:'would move the step down'})}${btn({label:'Remove',ghost:1,danger:1,msg:'would remove '+n.t+' after confirmation'})}</span></li>`}).join('')}</ol>`:
      plate({kind:'empty',title:'No steps yet',body:'Add a trigger to begin.',actions:[{label:'Add node…',primary:1,msg:'would open node search'}]})}</div>`;
  // inspector
  let insp;
  if(st==='loading') insp=`<div class="insp-b" aria-hidden="true">${[50,80,90,60].map(w=>`<span class="skel" style="width:${w}%;height:12px"></span>`).join('')}</div>`;
  else if(!cur) insp=`<div class="insp-b">${plate({kind:'empty',eyebrow:'Inspector',title:'Nothing selected',body:'Select or add a node to configure it.'})}</div>`;
  else {
    const tabs=`<div class="seg" role="group" aria-label="Inspector mode"><button type="button" data-act="wtab" data-arg="configure" aria-pressed="${W.tab==='configure'}">Configure</button><button type="button" data-act="wtab" data-arg="debug" aria-pressed="${W.tab==='debug'}">Debug</button></div>`;
    let b='';
    if(st==='error') b+=plate({kind:'error',band:1,title:'Can’t connect Read note to Show notification',body:'Read note outputs <b>Text</b>; Show notification needs a <b>Notification</b> input. Insert a Format text step, or connect Summarise instead.',actions:[{label:'Insert Format text',msg:'would insert a Format text node between them'},{label:'Cancel connection',ghost:1,msg:'would discard the pending connection'}]});
    if(W.tab==='configure'){
      if(cur.id==='n3') b+=`<div class="field"><span class="flabel">Model</span><div class="ro">${ic('lock')}Configured provider / configured model</div><span class="help">Workflows use the global AI setting. Change it in Settings → AI.</span></div>
        <div class="field"><label for="wprompt">Instruction</label><textarea id="wprompt" class="inp">Summarise this checklist in three bullets. Mark open items.</textarea></div>
        <div class="field"><label for="wlen">Length</label><select id="wlen" class="sel"><option>Three bullets</option><option>One paragraph</option></select></div>`;
      else if(cur.id==='n1') b+=`<div class="field"><label for="wsch">Runs</label><select id="wsch" class="sel"><option>Weekdays at 08:00</option><option>Every day at 08:00</option></select><span class="help">Only while you’re logged in and Linuxcast is running.</span></div>`;
      else if(cur.id==='n2') b+=`<div class="field"><label for="wnote">Note</label><select id="wnote" class="sel"><option>Launch checklist</option><option>Morning brief ideas</option></select></div>`;
      else b+=`<div class="field"><label for="wtitle">Title</label><input id="wtitle" class="inp" value="Morning brief"></div><div class="field"><span class="flabel">Body</span><div class="ro">From Summarise · Text</div></div>`;
      b+=`<div class="field"><span class="flabel">Ports</span><dl class="kv"><dt>Input</dt><dd>${cur.in?esc(cur.in):'—'}</dd><dt>Output</dt><dd>${cur.out?esc(cur.out):'—'}</dd></dl></div>
        <div class="field"><span class="flabel">Effects declared by this step</span><span class="help">${cur.id==='n3'?'Sends note text to the configured provider.':cur.id==='n2'?'Reads one note.':cur.id==='n4'?'Shows an app-owned notification.':'Starts runs on a schedule.'}</span></div>`;
    } else {
      if(st==='interrupted') b+=plate({kind:'interrupted',band:1,title:'Run stopped at Summarise — outcome unknown',body:'Linuxcast stopped during this step. The provider may or may not have received the request, so it won’t resend automatically.',detail:'run 2026-11-01 08:00 · step 3 of 4 (synthetic)',actions:[{label:'Review and re-run',primary:1,msg:'would open a review before re-running from step 3'},{label:'Discard run',ghost:1,msg:'would mark the run as discarded'}]});
      b+=`<dl class="kv"><dt>Last test run</dt><dd>${st==='interrupted'?statusTag('interrupted','Interrupted'):statusTag('success','Succeeded')}</dd><dt>Duration</dt><dd class="num">${st==='interrupted'?'—':'1.4 s (synthetic)'}</dd><dt>Started</dt><dd class="num">Today 08:00</dd></dl>
        <div class="field"><span class="flabel">Input</span><pre class="mono" style="margin:0;font-size:12px;line-height:16px;background:var(--tool-surface);border:1px solid var(--divider);border-radius:4px;padding:8px;white-space:pre-wrap">text · 2.1 KB · “Launch checklist …”</pre></div>
        <div class="field"><span class="flabel">Output</span><pre class="mono" style="margin:0;font-size:12px;line-height:16px;background:var(--tool-surface);border:1px solid var(--divider);border-radius:4px;padding:8px;white-space:pre-wrap">${st==='interrupted'?'— no output recorded —':'text · 3 bullets · 212 chars'}</pre></div>
        <span class="help">Secrets appear as handles, e.g. <span class="mono">secret:provider-key</span>; values are never shown.</span>`;
    }
    insp=`<div class="insp-h"><div style="display:flex;align-items:center;gap:8px">${tile(cur.tile,cur.icon)}<b>${esc(cur.t)}</b><span class="muted" style="font-size:12px">${esc(cur.cat)}</span></div>${tabs}</div><div class="insp-b">${b}</div>`;
  }
  let topBand='';
  if(st==='denied') topBand=`<div style="padding:8px 12px 0;background:var(--surface)">${plate({kind:'denied',band:1,title:'Automatic runs are off — effects not approved',body:'You declined the effects review on 31 Oct. Morning brief won’t run on schedule until you approve: <b>reads note “Launch checklist”</b>, <b>sends that text to the configured provider</b>, <b>shows a notification</b>. Workflows can’t approve their own effects.',actions:[{label:'Review effects',primary:1,icon:'shield',msg:'would open the effects review'},{label:'Test run once',ghost:1,msg:'would run once with explicit confirmation'}]})}</div>`;
  if(st==='unsupported') topBand=`<div style="padding:8px 12px 0;background:var(--surface)">${plate({kind:'unsupported',band:1,title:'Clipboard-change trigger isn’t supported here',body:'GNOME on Wayland doesn’t notify applications about clipboard changes without the Linuxcast companion. Schedule and Hotkey triggers work.',detail:'session: GNOME 48 · Wayland · clipboard watch: unavailable'})}</div>`;
  const save=st==='loading'?'Loading…':st==='empty'?'New · not saved':st==='error'?'Draft · 1 invalid connection':'Draft · 2 unsaved changes';
  return `<div class="spec" style="--frame-w:1180px"><span>Workspace · palette 240 · canvas · inspector 300 · node 208</span><span>Canvas position is presentation only</span></div>
  <div class="ws"><div class="wsh">${tile('workflow','workflow')}<span class="ttl">Morning brief</span><span class="savest">${esc(save)}</span><span class="grow"></span>
    <button type="button" class="btn ghost hide-n" data-act="sim" data-msg="would open the package export dialog">${ic('export')}Package…</button>
    ${btn({label:'Test run',icon:'play',keys:['Ctrl','Enter'],msg:'would run once with test inputs; effects still need approval'})}
    ${btn({label:'Save',primary:1,keys:['Ctrl','S'],disabled:st==='loading',msg:'would save the workflow draft'})}</div>
    <div class="wsb wf">${pal}
      <section class="canvas-wrap" aria-label="Graph">${topBand}
        <div class="ctool"><div class="seg" role="group" aria-label="Graph view"><button type="button" data-act="wfmode" data-arg="canvas" aria-pressed="${W.mode==='canvas'}">${ic('canvas')}Canvas</button><button type="button" data-act="wfmode" data-arg="list" aria-pressed="${W.mode==='list'}">${ic('list')}Structured list</button></div>
        <span class="help">${W.mode==='canvas'?'Drag ports to connect — or use Structured list':'Keyboard path: Tab to a step, then Connect, Move or Remove'}</span></div>
        ${W.mode==='canvas'?`<div class="canvas" tabindex="0" aria-label="Canvas (scrollable). Nodes are buttons; Tab moves between them.">${canvas}</div>`:slist}
      </section>
      <aside class="insp" aria-label="Inspector">${insp}</aside></div></div>`;
}

function vSettings(){

      </div></div>

      <div class="card"><div class="card-h"><div><h2>Local speech</h2><p>Configured separately. Not used as an AI fallback.</p></div></div><div style="padding:0 16px 16px">${statusTag('unsupported','No local model installed')}</div></div>`;
  } else if(P.cat==='input'){
    page=`<h1>Privileged input</h1><p class="lead">An optional system service for text expansion and Hyper key remapping. It ships <b>disabled and stopped</b>; Linuxcast never enables it on its own.</p>

      <ul class="caps">${capRow('Service',st==='interrupted'?'interrupted':'unsupported','Disabled · stopped','linuxcast-inputd.service','')}${capRow('Emergency disarm','success','Ready when enabled','Left Ctrl + Right Ctrl + Escape','')}</ul>
      <div class="card-f">${btn({label:'Set up…',msg:'would open the guided setup; requires administrator authentication'})}</div></div>`;
  } else if(P.cat!=='permissions'){
    page=`<h1>${esc((SETCATS.find(c=>c[0]===P.cat)||[])[1]||'')}</h1>${plate({kind:'empty',eyebrow:'Out of scope',title:'Not part of this design review',body:'This category exists for navigation only. See Permissions and capabilities, AI, or Privileged input.'})}`;
  } else {
    const loading=st==='loading';
    const caps=loading?[0,1,2,3,4,5].map(()=>`<li aria-hidden="true"><span class="skel" style="width:60%"></span><span class="skel" style="width:50%"></span><span class="skel" style="width:70%"></span><span></span></li>`).join(''):
      capRow('Global shortcut','success','Available','GlobalShortcuts portal · Alt+Space',btn({label:'Change…',ghost:1,msg:'would open the shortcut recorder'}))+
      capRow('Paste into apps','pending','Needs consent','RemoteDesktop portal',btn({label:'Request…',ghost:1,msg:'would ask the desktop for remote-input consent'}))+
      capRow('Window list','unsupported','Unavailable','GNOME 48 · Wayland · needs companion',btn({label:'Add companion…',ghost:1,msg:'would open companion setup'}))+
      capRow('Extension sandbox','success','Available','bubblewrap · user namespaces',null)+
      capRow('Credential storage',st==='error'?'error':st==='unsupported'?'unsupported':'success',st==='error'?'Not responding':st==='unsupported'?'Session only':'Available',st==='unsupported'?'keyring backend: basic_text':'Secret Service keyring',st==='error'?btn({label:'Retry',ghost:1,icon:'retry',msg:'would re-check the keyring'}):null)+
      capRow('Privileged input',st==='interrupted'?'interrupted':'unsupported','Disabled · stopped','Optional system service',btn({label:'Set up…',ghost:1,act:'scat',arg:'input'}));
    let capBand='';
    if(st==='error') capBand=`<div style="padding:0 12px">${plate({kind:'error',band:1,title:'Couldn’t reach the system keyring',body:'The Secret Service didn’t respond. Credentials you enter now are kept for this session only until it’s reachable again.',actions:[{label:'Retry',icon:'retry',msg:'would re-check the keyring'},{label:'Keyring help',ghost:1,msg:'would open keyring setup help'}]})}</div>`;
    if(st==='unsupported') capBand=`<div style="padding:0 12px">${plate({kind:'unsupported',band:1,title:'Persistent credentials unavailable',body:'The keyring reports a plain-text backend (basic_text), so Linuxcast won’t save credentials to disk. Keys you enter are kept for this session and cleared on quit.',actions:[{label:'How to set up a keyring',msg:'would open keyring setup help'}]})}</div>`;
    if(st==='interrupted') capBand=`<div style="padding:0 12px">${plate({kind:'interrupted',band:1,title:'Privileged input setup was cancelled',body:'Authentication was dismissed, so nothing changed. The input service remains <b>disabled and stopped</b>.',actions:[{label:'Start setup again',msg:'would restart guided setup'}]})}</div>`;
    const choice=P.choice;
    const opt=(v,l,d)=>`<label class="opt"><input type="radio" name="pchoice" value="${v}" data-act="pchoice" data-arg="${v}" ${choice===v?'checked':''}><span>${l}</span><small>${d}</small></label>`;

      `<div class="card" role="group" aria-labelledby="permT"><div class="perm-band">${ic('st_pending')}<div><span class="eb" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--focus);font-weight:600">Permission request</span><b id="permT">Release Notes Helper wants to read a folder</b></div></div>
        <dl class="pdl"><dt>Requesting package</dt><dd><b>Release Notes Helper</b> 1.2.0 <span class="muted mono" style="font-size:12px">example.release-notes</span> <span class="muted">(synthetic)</span></dd>
