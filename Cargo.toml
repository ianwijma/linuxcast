[workspace]
resolver = "3"
members = ["scripts/test-runner/native", "spikes/input"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
age = { version = "=0.12.1", default-features = false }

libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
