name: Planning documents
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation and task graph
        run: python3 scripts/validate_plan.py
      - name: Report ready tasks
        run: python3 scripts/plan_status.py
      - name: Verify documentation gate rejects invalid plans
        run: python3 scripts/test_validate_plan.py
